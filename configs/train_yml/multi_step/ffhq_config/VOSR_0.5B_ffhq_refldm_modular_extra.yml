# Add/merge these fields into your existing VOSR_0.5B_ffhq_ref.yml.
# Stage A: safest smoke test.
use_refldm: true
use_ref_feature: false
use_ref_latent: false
use_identity_loss: false

# Dataset must return ref: [B,K,3,H,W]
dataset_type: ffhq_ref
ffhq_ref_return_ref: true
ffhq_ref_num_refs: 1
ffhq_ref_crop_mode: random

# Stage B: enable after Stage A is stable.
# use_ref_feature: true
ref_feature_weight: 0.05

# Stage C: identity loss. Enable only after IdentityLoss import works.
# use_identity_loss: true
identity_loss_weight: 0.0001
identity_timestep_gamma: 0.5
identity_model_path: /data/zhangdanning/Projects/ref-ldm/pretrained/insightface_webface_r50.onnx

# Optional latent encoding for future ref-token extension.
ref_vae_encode_chunk: 1

# Eval speed control. 0 = all images.
ffhq_ref_eval_max_images: 50
